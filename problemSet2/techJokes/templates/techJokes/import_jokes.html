<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Import Jokes</title>
</head>
<body>
    <h1>Import Jokes</h1>
    <p><a href="{% url 'techJokes:index' %}">Back to Tech Jokes</a></p>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Import</button>
    </form>
</body>
</html>
